function listen(){const q=(c,o,l)=>query(collection(db,c),orderBy(...o),limit(l));
unsubs=[onSnapshot(collection(db,"users"),s=>{USERS={};s.forEach(d=>USERS[d.id]=d.data());U=USERS[UID]||U;up()},()=>{}),
onSnapshot(CR,s=>{CFG={...DEF(),...(s.exists()?s.data():{})};up()},()=>{}),
onSnapshot(q("posts",["ts","desc"],30),s=>{POSTS=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=="wall")up()},()=>{}),
onSnapshot(q("chat",["ts","desc"],60),s=>{const near=innerHeight+scrollY>document.body.scrollHeight-160;CHAT=s.docs.map(d=>({id:d.id,...d.data()})).reverse();if(tab=="chat"){up();if(near)scrollTo(0,document.body.scrollHeight)}},()=>{}),
onSnapshot(collection(db,"mats"),s=>{MATS=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=="study"||tab=="me")up()},()=>{})]}
if(FB.apiKey){db=getFirestore(initializeApp(FB));auth=getAuth();CR=doc(db,"cfg","main");route();
onAuthStateChanged(auth,async u=>{unsubs.forEach(x=>x());unsubs=[];U=null;
if(!u){UID=null;ready=1;an=1;R();return}
UID=u.uid;try{const r=doc(db,"users",UID);if(!(await getDoc(r)).exists())await setDoc(r,{name:u.displayName||"Student",photo:"",role:OWNER&&u.email&&u.email.toLowerCase()==OWNER.toLowerCase()?"owner":"member"})}catch(e){toast("Could not load your profile.")}
ready=1;an=1;listen();setTimeout(()=>{if(!U){an=1;R()}},1500)})}else{ready=1;R()}
</script>
</body>
</html>
