<style>

:root[data-theme="dark"]{--bg:#0a0b10;--sf:#14161d;--s2:#1c1f28;--tx:#f3f4f8;--mu:#8a8fa0;--ln:#242732;--sh:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

@keyframes spo{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes pop2{from{transform:scale(.3) rotate(-25deg);opacity:0}}

.gt{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2::before{content:"";display:inline-block;width:4px;height:15px;border-radius:2px;background:linear-gradient(var(--ac),var(--ac2));margin-right:9px;vertical-align:-2px}
.hero::before{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-150%) skewX(-20deg);animation:sh 5s 1.5s ease-in-out infinite}

@keyframes sh{0%,55%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(420%) skewX(-20deg)}}
.lv{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:7px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.8);opacity:.4}}
.tr.now .tc{animation:gl 2.4s ease-in-out infinite}

.bd{animation:cf 4s linear infinite}
@keyframes cf{to{background-position:30px 30px,0 0}}
.rx.on{animation:pp .35s}
@keyframes pp{40%{transform:scale(1.25)}}
nav button.on svg{animation:bn .5s}
@keyframes bn{40%{transform:translateY(-4px) scale(1.15)}}
.typ{display:flex;align-items:center;gap:8px;margin:-4px 0 12px}
.typ span{display:flex;gap:3px;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:8px 10px}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--mu);animation:bo 1.2s infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}

.card{transition:transform .2s,box-shadow .2s}

@media (prefers-reduced-motion:reduce){#sp,.bg{display:none}}

#gate{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:var(--bg);padding:24px;overflow:auto}

.gc .btn{width:100%;margin:12px 0 0}
#pt{display:block;resize:vertical}
</style>

function chat(){return`<h2 style="margin-top:0">Class chat</h2><div class="mu" style="margin:-6px 0 14px">3 online</div><div id="ms">${msgs()}</div><div class="mu typ"><span><i></i><i></i><i></i></span>Karthik is typing</div><div class="cin"><input id="ci" placeholder="Message the class" autocomplete="off" onkeydown="if(event.key=='Enter')snd()"><button onclick="snd()">Send</button></div>`}
function snd(){const i=$("ci"),v=i.value.trim();if(!v)return;i.value="";sendMsg(v)}
function study(){if(op){const[n,s,c]=SUB[op];return`<button class="lk" onclick="op=null;an=1;R()">Back to subjects</button><h1>${n}</h1><div class="mu" style="margin-bottom:14px">${s}</div>`+[1,2,3,4,5].map(i=>`<div class="card" style="margin-bottom:10px"><b>Unit ${i}</b><div class="mu">No materials yet. Your rep can add links here.</div></div>`).join("")}
return`<h2 style="margin-top:0">Study material</h2><div class="g2">${Object.keys(SUB).map(c=>`<button class="sc" style="--c:${SUB[c][2]}" onclick="op='${c}';an=1;R()"><i>${c.slice(0,2)}</i><div><b>${SUB[c][0]}</b><div class="mu">${SUB[c][1]}</div></div></button>`).join("")}</div>`}
function tg(){th=dk()?"light":"dark";document.documentElement.dataset.theme=th;st.set("th",th);an=0;R()}
function me(){return`<div class="card" style="text-align:center;padding:26px"><div style="display:flex;justify-content:center">${av(ME.name,96,!ME.hide,ME.photo)}</div><h1 style="margin-top:12px">${E(ME.name)}</h1><div style="margin-top:8px">${rb(RL[ME.role]||"Member")}</div><button class="btn" onclick="$('pf').click()">Change photo</button><input id="pf" type="file" accept="image/*" hidden onchange="chp(this)"></div><div class="card" style="margin-top:12px;padding:4px 16px"><div class="row" style="border:0"><div><b>Show online status</b><div class="mu">Green dot when you were just active in chat</div></div><button class="sw${ME.hide?"":" on"}" aria-label="Online status" onclick="hid()"></button></div><div class="row"><b>Dark mode</b><button class="sw${dk()?" on":""}" aria-label="Dark mode" onclick="tg()"></button></div></div>${REPQ()?'<div class="card" style="margin-top:12px"><b>Class management</b><div class="mu">Approve new students'+(ME.role=="owner"?' and manage roles':'')+'</div><button class="btn" onclick="ppl(0)">New students</button>'+(ME.role=="owner"?' <button class="btn" onclick="ppl(1)">Everyone</button>':"")+'<div id="pe"></div></div>':""}<button class="cof" onclick="out()">Sign out</button>`}
function fx(a){document.querySelectorAll(".pg").forEach(e=>{const v=e.dataset.o;if(!a){e.style.strokeDashoffset=v;return}e.style.strokeDashoffset=169.6;setTimeout(()=>{e.style.strokeDashoffset=v},80)});if(!a)return;document.querySelectorAll(".cu").forEach(e=>{const n=+e.dataset.n,s=performance.now();(function s2(t){const p=Math.min((t-s)/800,1);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s2)})(s)})}
const TABS=[["home","Home"],["wall","Wall"],["chat","Chat"],["study","Study"],["me","Me"]],NI={home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',wall:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',study:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-7 8-7s7 2 8 7"/>'};
$("n").innerHTML='<i class="ind" id="ind"></i>'+TABS.map((x,i)=>`<button id="b${i}" onclick="sw('${x[0]}')"><svg viewBox="0 0 24 24">${NI[x[0]]}</svg>${x[1]}</button>`).join("");
function sw(t){tab=t;op=null;an=1;R()}
function R(){const a=an;an=0;const t=new Date(),o=dayOrder(t),h=t.getHours();
$("hd").innerHTML=`<div><div class="mu">${fd(t)}</div><h1>Good ${h<12?"morning":h<17?"afternoon":"evening"}, <span class="gt">${E((ME.name||"").split(" ")[0])}</span></h1></div><button style="background:none;border:0;padding:0" aria-label="Profile" onclick="sw('me')">${av(ME.name,44,!ME.hide,ME.photo)}</button>`;
$("v").className=a?"go":"";$("v").innerHTML={home,wall,chat,study,me}[tab]();if(a)[...$("v").children].forEach((c,i)=>c.style.animationDelay=Math.min(i*45,700)+"ms");fx(a);
TABS.forEach((x,i)=>$("b"+i).classList.toggle("on",x[0]==tab));$("ind").style.transform="translateX("+TABS.findIndex(x=>x[0]==tab)*100+"%)"}
matchMedia("(prefers-reduced-motion:reduce)").matches?R():setTimeout(R,1000);setTimeout(()=>{const s=$("sp");if(s)s.remove()},1800);setInterval(()=>{if(tab=="home")R()},30000);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,onSnapshot,collection,query,where,orderBy,limit,serverTimestamp,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCepRa2-XklHzhhbM5vYgaPJxl9h6BYfYU",authDomain:"kampfire-a41ea.firebaseapp.com",projectId:"kampfire-a41ea",storageBucket:"kampfire-a41ea.firebasestorage.app",messagingSenderId:"477221341414",appId:"1:477221341414:web:6325cdceae960b68479327"});
const A=getAuth(app),D=getFirestore(app),$g=document.getElementById("gate"),uref=()=>doc(D,"users",ME.uid);
let SPIC="",on=0,LA=0;
const G={login:'<h1>Kampfire</h1><p class="mu">Sign in to join your class.</p><button class="btn" onclick="gIn()">Sign in with Google</button><p class="mu" id="ge"></p>',
setup:'<h1>Almost there</h1><p class="mu">Choose how your classmates will see you.</p><input type="text" id="gn" maxlength="24" placeholder="Display name"><label class="mu">Birthday (optional, only day and month are shown)</label><input type="date" id="gd"><button class="btn" style="background:var(--s2);color:var(--tx)" onclick="$(\'gf\').click()">Add profile photo (optional)</button><input id="gf" type="file" accept="image/*" hidden onchange="gp(this)"><div class="mu" id="gm"></div><button class="btn" onclick="fin()">Continue</button><p class="mu" id="ge"></p>',
wait:'<h1>Waiting for approval</h1><p class="mu">A class rep will approve you soon. This page updates by itself.</p><button class="btn" onclick="out()">Sign out</button>'};
const gate=k=>{if(!k){$g.style.display="none";return}$g.style.display="grid";$g.innerHTML='<div class="gc">'+G[k]+'</div>'};
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);r(c.toDataURL("image/jpeg",.72))};im.src=fr.result};fr.readAsDataURL(f)});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"})};
const mp=d=>{const x=d.data(),t=x.t?x.t.toMillis():Date.now(),r={};for(const e in RK){const a=(x.re&&x.re[RK[e]])||[];r[e]=[a.length,a.includes(ME.uid)?1:0]}return{id:d.id,n:E(x.name||"?"),r:RL[x.role]||"Member",ph:ok(x.photo),on:!x.hide&&Date.now()-t<3e5,me:x.uid==ME.uid,x:E(x.text||""),t:ago(t),pin:x.pin,re:r}};
const q=(n,l)=>query(collection(D,n),orderBy("t","desc"),limit(l));
function start(){if(on)return;on=1;an=1;gate();
onSnapshot(q("messages",40),s=>{MSG.splice(0,MSG.length,...s.docs.map(mp).reverse());if(tab=="chat"&&$("ms")){$("ms").innerHTML=msgs();scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}},e=>console.error(e));
onSnapshot(q("posts",30),s=>{POSTS.splice(0,POSTS.length,...s.docs.map(mp).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)));if(tab=="wall"&&$("pl"))$("pl").innerHTML=postsHtml()},e=>console.error(e));
const bd=doc(D,"meta","birthdays"),md=String(new Date().getMonth()+1).padStart(2,"0")+"-"+String(new Date().getDate()).padStart(2,"0");
(ME.dob?setDoc(bd,{[ME.uid]:{name:ME.name,md:ME.dob}},{merge:true}).catch(()=>{}):Promise.resolve()).then(()=>getDoc(bd)).then(s=>{BD.splice(0,BD.length,...Object.values(s.exists()?s.data():{}).filter(b=>b&&b.md==md).map(b=>({name:E(b.name||"?"),photo:""})));if(tab=="wall"){an=0;R()}}).catch(()=>{})}
onAuthStateChanged(A,u=>{if(!u){gate("login");return}ME.uid=u.uid;
onSnapshot(uref(),s=>{if(!s.exists()){gate("setup");return}const d=s.data();Object.assign(ME,{name:d.name,role:d.role,photo:ok(d.photo),hide:!!d.hide,dob:d.dob||""});if(d.role=="pending")gate("wait");else{start();R()}},e=>{gate("login");const g=$("ge");if(g)g.textContent="Database error: "+e.code})});
Object.assign(window,{
gIn:()=>signInWithPopup(A,new GoogleAuthProvider()).catch(e=>{$("ge").textContent="Sign-in failed: "+e.code}),
out:()=>signOut(A).then(()=>location.reload()),
gp:async i=>{if(i.files[0]){SPIC=await shrink(i.files[0]);$("gm").textContent="Photo added"}},
fin:async()=>{const n=$("gn").value.trim().slice(0,24),d=$("gd").value;if(n.length<2){$("ge").textContent="Please enter a display name.";return}try{await setDoc(uref(),{name:n,role:"pending",photo:SPIC,hide:false,dob:d?d.slice(5):""})}catch(e){$("ge").textContent="Could not save: "+e.code}},
sendMsg:v=>addDoc(collection(D,"messages"),{uid:ME.uid,name:ME.name,role:ME.role,photo:ME.photo||"",text:v.slice(0,500),t:serverTimestamp(),hide:!!ME.hide,re:{}}).catch(e=>console.error(e)),
post:async()=>{const v=$("pt").value.trim();if(!v)return;await addDoc(collection(D,"posts"),{uid:ME.uid,name:ME.name,role:ME.role,photo:ME.photo||"",text:v.slice(0,500),t:serverTimestamp(),pin:$("pn").checked,re:{}});$("pt").value=""},
rx:(k,i,e)=>{const x=(k=="p"?POSTS:MSG)[i];updateDoc(doc(D,k=="p"?"posts":"messages",x.id),{["re."+RK[e]]:x.re[e][1]?arrayRemove(ME.uid):arrayUnion(ME.uid)}).catch(e=>console.error(e))},
del:(k,i)=>deleteDoc(doc(D,k=="p"?"posts":"messages",(k=="p"?POSTS:MSG)[i].id)),
hid:()=>updateDoc(uref(),{hide:!ME.hide}),
chp:async i=>{if(i.files[0])updateDoc(uref(),{photo:await shrink(i.files[0])})},
ppl:async a=>{LA=a;const s=await getDocs(a?collection(D,"users"):query(collection(D,"users"),where("role","==","pending"))),L=s.docs.map(d=>({id:d.id,...d.data()}));
$("pe").innerHTML=L.length?L.map(u=>{const b=u.id==ME.uid?"":u.role=="pending"?`<button class="rx" onclick="setRole('${u.id}','member')">Approve</button>`:ME.role=="owner"?(u.role=="member"?`<button class="rx" onclick="setRole('${u.id}','rep')">Make rep</button>`:u.role=="rep"?`<button class="rx" onclick="setRole('${u.id}','member')">Make member</button>`:""):"";return`<div class="row"><div style="display:flex;gap:10px;align-items:center">${av(E(u.name||"?"),34,0,ok(u.photo))}<div><b>${E(u.name||"?")}</b><div class="mu">${RL[u.role]||u.role}</div></div></div><div>${b}</div></div>`}).join(""):'<div class="mu" style="margin-top:10px">Nobody here.</div>'},
setRole:(id,r)=>updateDoc(doc(D,"users",id),{role:r}).then(()=>ppl(LA))
});
</script>
